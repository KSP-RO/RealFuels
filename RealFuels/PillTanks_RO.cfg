// Realism Overhaul's wet wings: the tank is the wing's own structure (sealed spars and skins), not a pill inside it,
// so its volume stays the wing's. The service module types a wing also takes (SM-I..IV) stay pill tanks.
@TANK_DEFINITION[Tank-Wet-Wing*]:NEEDS[RealismOverhaul]
{
	%pillTank = false
}
